<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنشاء شخصية جديدة | صقور بوليتو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b141b; --bg2:#14222c; --panel:#101b23; --field:#0a1218; --line:#22333f;
  --gold:#d9b86c; --gold-d:#b8954a; --text:#e8e2d0; --muted:#7f8e98; --err:#e07a6a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#0b141b}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tajawal,Tahoma,sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg)}
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;align-items:center;gap:8px}
.brand svg{width:44px;height:48px;display:block}
.brand b{font-size:15px;color:var(--gold);font-weight:800;line-height:1.1}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}
main{max-width:640px;margin:0 auto;padding:78px 16px 32px}
h1{margin:0;text-align:center;font-size:clamp(28px,6vw,38px);color:#f0dfae;font-weight:800}
.sub{margin:6px 0 22px;text-align:center;color:var(--muted);font-size:13px}
form,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--gold);font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;margin-bottom:5px;font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;font:inherit;font-size:14px;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:#4a5a65}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,184,108,.18)}
input[aria-invalid="true"]{border-color:var(--err)}
textarea{min-height:110px;resize:vertical}
.hint{margin-top:5px;font-size:11px;color:var(--muted)}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
.actions{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:700;border-radius:6px;padding:10px 20px;cursor:pointer;border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);color:#241c08;border-color:var(--gold)}
.primary:hover{background:var(--gold-d)}
.ghost{background:var(--bg2);color:var(--text)}
.ghost:hover{border-color:var(--gold)}
footer{margin-top:22px;text-align:center;font-size:10px;color:#4a5a65;letter-spacing:.08em}
/* ID card */
#result{display:none;margin-top:18px}
.id{border:1px solid var(--gold-d);background:linear-gradient(135deg,#14222c,#0d171e);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.id-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.id-head strong{color:var(--gold);font-size:15px}
.id-no{font-size:12px;color:var(--muted);direction:ltr}
.id dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.id dt{font-size:11px;color:var(--muted)}
.id dd{margin:2px 0 0;font-size:15px;font-weight:500}
.id .story{grid-column:1/-1}
.id .story dd{font-size:13px;line-height:1.7;color:#cfc8b4;white-space:pre-wrap}
@media (max-width:520px){.grid{grid-template-columns:1fr}.id dl{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="brand" aria-label="شعار صقور بوليتو">
  <svg viewBox="0 0 64 70" role="img" aria-hidden="true">
    <path d="M32 3 59 13v22c0 17-12 28-27 33C17 63 5 52 5 35V13z" fill="#101b23" stroke="#d9b86c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 17c-3 0-5 2-6 5l-12 6 10-1-6 9 9-3c1 4 3 7 5 9 2-2 4-5 5-9l9 3-6-9 10 1-12-6c-1-3-3-5-6-5z" fill="#d9b86c"/>
    <circle cx="32" cy="26" r="1.6" fill="#101b23"/>
    <path d="M12 52h40" stroke="#d9b86c" stroke-width="2" opacity=".6"/>
  </svg>
  <div><b>صقور بوليتو</b><small>Saqour Politto</small></div>
</div>

<main>
  <h1>إنشاء شخصية جديدة</h1>
  <p class="sub">سجّل بيانات شخصيتك وابدأ قصتك داخل مدينة صقور بوليتو.</p>

  <form id="f" novalidate>
    <h2 class="sec">المعلومات الشخصية</h2>
    <div class="grid">
      <div class="full">
        <label for="name">الاسم الكامل للشخصية *</label>
        <input id="name" placeholder="مثال: أحمد محمد" autocomplete="off" maxlength="60">
      </div>
      <div>
        <label for="age">العمر *</label>
        <input id="age" type="number" inputmode="numeric" min="18" max="90" placeholder="العمر">
      </div>
      <div>
        <label for="gender">الجنس</label>
        <select id="gender"><option>ذكر</option><option>أنثى</option></select>
      </div>
      <div>
        <label for="nat">الجنسية</label>
        <input id="nat" placeholder="مثال: بوليتي" maxlength="30">
      </div>
      <div>
        <label for="job">المهنة الحالية</label>
        <input id="job" placeholder="مثال: موظف" maxlength="40">
      </div>
      <div>
        <label for="birth">مكان الولادة</label>
        <input id="birth" placeholder="المدينة أو الدولة" maxlength="40">
      </div>
      <div>
        <label for="status">الحالة الاجتماعية</label>
        <select id="status"><option>أعزب</option><option>متزوج</option><option>مطلق</option><option>أرمل</option></select>
      </div>
      <div class="full">
        <label for="blood">فصيلة الدم (اختياري)</label>
        <select id="blood"><option>غير محدد</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
      </div>
      <div class="full">
        <label for="story">قصة الشخصية وخلفيتها</label>
        <textarea id="story" maxlength="500" placeholder="اكتب نبذة عن ماضي الشخصية وسبب قدومها إلى بوليتو..."></textarea>
        <div class="hint">اكتب قصة مختصرة تناسب أحداث الرول بلاي، بحد أقصى 500 حرف. <span id="cnt">0/500</span></div>
      </div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions">
      <button type="button" class="ghost" id="clear">مسح البيانات</button>
      <button type="submit" class="primary">إنشاء بطاقة الشخصية</button>
    </div>
  </form>

  <section id="result" aria-live="polite">
    <div class="id">
      <div class="id-head"><strong>بطاقة شخصية — صقور بوليتو</strong><span class="id-no" id="idno"></span></div>
      <dl id="out"></dl>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="copy">نسخ للديسكورد</button>
      <button type="button" class="ghost" id="edit">تعديل البيانات</button>
    </div>
  </section>

  <footer>SAQOUR POLITTO · ROLEPLAY CHARACTER REGISTRATION</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fields = ['name','age','gender','nat','job','birth','status','blood','story'];
const labels = {name:'الاسم',age:'العمر',gender:'الجنس',nat:'الجنسية',job:'المهنة',birth:'مكان الولادة',status:'الحالة الاجتماعية',blood:'فصيلة الدم',story:'القصة'};
let current = null;

$('story').addEventListener('input', e => { $('cnt').textContent = e.target.value.length + '/500'; });

$('clear').addEventListener('click', () => {
  $('f').reset(); $('cnt').textContent = '0/500'; $('err').textContent = '';
  ['name','age'].forEach(i => $(i).removeAttribute('aria-invalid'));
  $('result').style.display = 'none'; current = null;
});

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim(), age = parseInt($('age').value, 10);
  $('name').setAttribute('aria-invalid', !name);
  $('age').setAttribute('aria-invalid', !(age >= 18 && age <= 90));
  if (!name) { $('err').textContent = 'اكتب الاسم الكامل للشخصية.'; $('name').focus(); return; }
  if (!(age >= 18 && age <= 90)) { $('err').textContent = 'العمر لازم يكون بين 18 و 90.'; $('age').focus(); return; }
  $('err').textContent = '';
  const data = {}; fields.forEach(k => data[k] = $(k).value.trim());
  data.no = 'SP-' + Math.floor(100000 + Math.random() * 900000);
  current = data;
  $('idno').textContent = data.no;
  $('out').innerHTML = '';
  fields.forEach(k => {
    if (!data[k]) return;
    const wrap = document.createElement('div');
    if (k === 'story') wrap.className = 'story';
    const dt = document.createElement('dt'); dt.textContent = labels[k];
    const dd = document.createElement('dd'); dd.textContent = data[k];
    wrap.append(dt, dd); $('out').append(wrap);
  });
  $('f').style.display = 'none';
  $('result').style.display = 'block';
  window.scrollTo({top: 0, behavior: 'smooth'});
});

$('edit').addEventListener('click', () => {
  $('result').style.display = 'none'; $('f').style.display = 'block';
});

$('copy').addEventListener('click', async () => {
  if (!current) return;
  const lines = ['**🦅 بطاقة شخصية — صقور بوليتو**', '`' + current.no + '`'];
  fields.forEach(k => { if (current[k]) lines.push('**' + labels[k] + ':** ' + current[k]); });
  const txt = lines.join('\n');
  try { await navigator.clipboard.writeText(txt); $('copy').textContent = 'تم النسخ'; }
  catch (_) {
    const t = document.createElement('textarea'); t.value = txt; document.body.append(t); t.select();
    try { document.execCommand('copy'); $('copy').textContent = 'تم النسخ'; } catch (__) { $('copy').textContent = 'تعذّر النسخ'; }
    t.remove();
  }
  setTimeout(() => { $('copy').textContent = 'نسخ للديسكورد'; }, 1800);
});
</script>
</body>
</html>
